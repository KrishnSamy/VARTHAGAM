<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bamini 28 Comparison</title>
  <style>
    /* Embed the base64 font */
    @import '/src/assets/fonts/bamini28.css';

    body {
      background: #0d090a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
      gap: 20px;
    }
    .card {
      background: #1c1316;
      border: 1px solid #d97706;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .font-render-gold {
      font-family: 'BaminiTamil28';
      font-size: 64px;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #FFF5B8 0%, #F59E0B 45%, #D97706 75%, #FDE68A 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.8));
    }
    .font-render-red {
      font-family: 'BaminiTamil28';
      font-size: 64px;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #F87171 0%, #DC2626 50%, #991B1B 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.8));
    }
    .raw-image {
      filter: invert(1);
      width: 280px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h3 style="color: #f59e0b;">1. Original User Image Crop</h3>
    <img src="/logo/varthagam_font_raw.png" class="raw-image" alt="Original crop" />
  </div>

  <div class="card">
    <h3 style="color: #f59e0b;">2. Rendered with Bamini Tamil 28 (tu;j;jfk;) in Gold</h3>
    <div class="font-render-gold">tu;j;jfk;</div>
  </div>

  <div class="card">
    <h3 style="color: #f59e0b;">3. Rendered with Bamini Tamil 28 in Red & Gold</h3>
    <div class="font-render-red">tu;j;jfk;</div>
  </div>
</body>
</html>
